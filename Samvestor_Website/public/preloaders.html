<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Preloader ideas — SamVestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Anton&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   SamVestor preloader gallery — a scratch page, not part of the
   site. Nothing here is wired into the app; pick one and I'll
   build it properly into src/components/Preloader.jsx.
   ============================================================ */
:root {
    --canvas: #070b12;
    --navy-900: #0b1d3a;
    --navy-700: #1a2f52;
    --navy-500: #243d66;
    --gold: #c9a84c;
    --gold-light: #eed9a0;
    --ink: #edf2f8;
    --ink-dim: rgba(237, 242, 248, 0.55);
    --tile: #0b1220;
    --line: rgba(237, 242, 248, 0.12);
    /* the "not yet loaded" colour — tracks, unfilled text, empty bars */
    --ghost: rgba(237, 242, 248, 0.16);
    --font: 'Inter', system-ui, sans-serif;
    --accent-font: 'Anton', Impact, sans-serif;
}

:root[data-theme='light'] {
    --canvas: #f4f6fa;
    --ink: #0b1d3a;
    --ink-dim: rgba(11, 29, 58, 0.6);
    --tile: #ffffff;
    --line: rgba(11, 29, 58, 0.12);
    --ghost: rgba(11, 29, 58, 0.18);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
}

/* ---------------- page chrome ---------------- */
.top {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    padding: 18px 24px;
    background: color-mix(in srgb, var(--canvas) 86%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
}

.top h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.02em;
}

.top p {
    margin: 0;
    flex: 1 1 260px;
    font-size: 13px;
    color: var(--ink-dim);
}

.btn {
    padding: 9px 16px;
    border: 1px solid var(--gold);
    border-radius: 8px;
    background: none;
    color: var(--gold);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease;
}

.btn:hover { background: var(--gold); color: #10131a; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
    padding: 24px;
}

.card {
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: var(--tile);
    display: flex;
    flex-direction: column;
}

/* the little "screen" each loader plays inside */
.screen {
    position: relative;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: var(--canvas);
    cursor: zoom-in;
}

:root[data-theme='light'] .screen { background: #ffffff; }

.meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 12px 14px 14px;
    border-top: 1px solid var(--line);
}

.meta b { font-size: 11px; color: var(--gold); font-weight: 800; }
.meta span { font-size: 13px; font-weight: 700; }
.meta small { margin-left: auto; font-size: 11px; color: var(--ink-dim); text-align: right; }

/* fullscreen preview */
.stage {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--canvas);
    display: flex;
    flex-direction: column;
}

.stage[hidden] { display: none; }

.stage__bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
}

.stage__bar b { font-size: 14px; }
.stage__bar small { color: var(--ink-dim); font-size: 12px; }
.stage__bar .btn { margin-left: auto; }
.stage__screen { position: relative; flex: 1; overflow: hidden; }

/* ============================================================
   the loaders
   ============================================================ */
.pl {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
}

.pl__brand {
    font-weight: 900;
    letter-spacing: -0.03em;
    font-size: clamp(22px, 9cqw, 90px);
    line-height: 1;
    white-space: nowrap;
}

.screen, .stage__screen { container-type: inline-size; }

/* 1 — counter + bar ------------------------------------------------ */
.pl-counter .bar {
    width: 38cqw;
    height: 5px;
    background: var(--ghost);
    border-radius: 99px;
    overflow: hidden;
}
.pl-counter .fill {
    height: 100%;
    width: 100%;
    background: var(--gold);
    transform-origin: 0 50%;
    animation: fillX 2.6s cubic-bezier(0.45, 0, 0.1, 1) forwards;
}
.pl-counter .num {
    position: absolute;
    left: 6cqw;
    bottom: 5cqh;
    font-size: clamp(26px, 13cqw, 120px);
    font-weight: 500;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
}
@keyframes fillX { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* 2 — wordmark wipe ------------------------------------------------ */
.pl-wipe .word {
    background: linear-gradient(90deg, var(--gold) 50%, var(--ghost) 50%);
    background-size: 200% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: wipe 2.4s cubic-bezier(0.65, 0, 0.2, 1) forwards;
}
@keyframes wipe { to { background-position: 0 0; } }

/* 3 — letters rise ------------------------------------------------- */
.pl-rise .word { display: flex; }
.pl-rise .m { overflow: hidden; display: inline-block; }
.pl-rise .m i {
    display: inline-block;
    font-style: normal;
    transform: translateY(110%);
    animation: riseUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes riseUp { to { transform: translateY(0); } }

/* 4 — bar folds into a V ------------------------------------------- */
.pl-fold .rig { display: flex; }
.pl-fold i {
    display: block;
    width: 9cqw;
    height: 2.2cqw;
    min-height: 6px;
    background: var(--gold);
}
.pl-fold i:first-child { transform-origin: 100% 100%; animation: foldL 2.4s cubic-bezier(0.7, 0, 0.2, 1) forwards; }
.pl-fold i:last-child { transform-origin: 0 100%; animation: foldR 2.4s cubic-bezier(0.7, 0, 0.2, 1) forwards; }
@keyframes foldL { 0%, 45% { transform: rotate(0); } 75%, 100% { transform: rotate(58deg); } }
@keyframes foldR { 0%, 45% { transform: rotate(0); } 75%, 100% { transform: rotate(-58deg); } }

/* 5 — ring around the monogram ------------------------------------- */
.pl-ring svg { width: 34cqw; height: 34cqw; }
.pl-ring circle { fill: none; stroke-width: 3; }
.pl-ring .track { stroke: var(--ghost); }
.pl-ring .arc {
    stroke: var(--gold);
    stroke-linecap: round;
    stroke-dasharray: 264;
    stroke-dashoffset: 264;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    animation: drawRing 2.6s cubic-bezier(0.4, 0, 0.1, 1) forwards;
}
.pl-ring .mono {
    position: absolute;
    font-weight: 900;
    font-size: clamp(16px, 7cqw, 58px);
    letter-spacing: -0.02em;
}
.pl-ring .mono em { color: var(--gold); font-style: normal; }
@keyframes drawRing { to { stroke-dashoffset: 0; } }

/* 6 — curtain split ------------------------------------------------ */
.pl-curtain .half {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    background: var(--navy-900);
    animation: curtainL 2.6s cubic-bezier(0.8, 0, 0.2, 1) forwards;
}
.pl-curtain .half--r { left: 50%; animation-name: curtainR; }
.pl-curtain .half--l { left: 0; }
/* the logo sits on top of the panels, otherwise they cover it */
.pl-curtain img {
    position: relative;
    z-index: 2;
    width: 34cqw;
    animation: logoOut 2.6s cubic-bezier(0.8, 0, 0.2, 1) forwards;
}
@keyframes curtainL { 0%, 45% { transform: translateX(0); } 100% { transform: translateX(-101%); } }
@keyframes curtainR { 0%, 45% { transform: translateX(0); } 100% { transform: translateX(101%); } }
@keyframes logoOut { 0%, 40% { opacity: 1; transform: scale(1); } 65%, 100% { opacity: 0; transform: scale(0.82); } }

/* 7 — terminal ----------------------------------------------------- */
.pl-term .box {
    width: 74cqw;
    font-size: clamp(9px, 3.1cqw, 22px);
    line-height: 1.9;
    font-weight: 500;
}
.pl-term .row { display: flex; gap: 8px; color: var(--ink-dim); }
.pl-term .row b { color: var(--gold); font-weight: 700; }
.pl-term .caret {
    display: inline-block;
    width: 0.55em;
    height: 1.05em;
    translate: 0 0.18em;
    background: var(--gold);
    animation: blink 0.9s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* 8 — rolling digits ----------------------------------------------- */
.pl-roll .set { display: flex; gap: 0.02em; font-size: clamp(34px, 20cqw, 180px); font-weight: 800; letter-spacing: -0.05em; }
.pl-roll .col { height: 1em; overflow: hidden; }
.pl-roll .strip { display: flex; flex-direction: column; }
.pl-roll .strip span { height: 1em; line-height: 1; }
.pl-roll .cap { position: absolute; bottom: 8cqh; font-size: clamp(8px, 2.6cqw, 16px); letter-spacing: 0.34em; text-transform: uppercase; color: var(--ink-dim); }

/* 9 — equalizer ---------------------------------------------------- */
.pl-eq .bars { display: flex; align-items: flex-end; gap: 2.2cqw; height: 30cqh; }
.pl-eq i {
    display: block;
    width: 4cqw;
    background: linear-gradient(var(--gold-light), var(--gold));
    border-radius: 3px;
    transform-origin: 50% 100%;
    animation: eq 1.05s ease-in-out infinite alternate, eqEnd 2.8s forwards;
}
@keyframes eq { from { height: 18%; } to { height: 100%; } }
@keyframes eqEnd { 0%, 72% { opacity: 1; } 100% { opacity: 1; height: 8%; } }

/* 10 — revenue line ------------------------------------------------ */
.pl-line svg { width: 64cqw; overflow: visible; }
.pl-line path {
    fill: none;
    stroke: var(--gold);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: drawLine 2.3s cubic-bezier(0.5, 0, 0.2, 1) forwards;
}
.pl-line .dot { fill: var(--gold); r: 5; opacity: 0; animation: popDot 0.5s ease 2.1s forwards; filter: drop-shadow(0 0 8px var(--gold)); }
@keyframes drawLine { to { stroke-dashoffset: 0; } }
@keyframes popDot { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }

/* 11 — pixel grid -------------------------------------------------- */
.pl-pixels .mesh { display: grid; gap: 1.2cqw; width: 46cqw; }
.pl-pixels b {
    aspect-ratio: 1;
    background: var(--gold);
    opacity: 0;
    transform: scale(0.4);
    animation: pix 0.5s cubic-bezier(0.2, 1, 0.3, 1) forwards;
}
@keyframes pix { to { opacity: 1; transform: scale(1); } }

/* 12 — blur into focus --------------------------------------------- */
.pl-blur .word {
    filter: blur(18px);
    letter-spacing: 0.42em;
    opacity: 0;
    animation: focusIn 2.5s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
}
@keyframes focusIn {
    0% { filter: blur(18px); letter-spacing: 0.42em; opacity: 0; }
    60% { opacity: 1; }
    100% { filter: blur(0); letter-spacing: -0.03em; opacity: 1; }
}

/* 13 — scramble ---------------------------------------------------- */
.pl-scramble .word { font-family: var(--font); }
.pl-scramble .word i { font-style: normal; display: inline-block; min-width: 0.62em; text-align: center; }
.pl-scramble .word i.on { color: var(--ink); }
.pl-scramble .word i.off { color: var(--gold); }

/* 14 — coin flip --------------------------------------------------- */
.pl-coin .coin {
    width: 26cqw;
    height: 26cqw;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--gold-light), var(--gold) 55%, #8d6f27);
    display: grid;
    place-items: center;
    color: #14202f;
    font-weight: 900;
    font-size: clamp(16px, 11cqw, 80px);
    transform-style: preserve-3d;
    animation: flipCoin 2.5s cubic-bezier(0.3, 0, 0.2, 1) forwards;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
}
@keyframes flipCoin {
    0% { transform: perspective(700px) rotateY(0) translateY(-40%); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: perspective(700px) rotateY(1440deg) translateY(0); }
}

/* 15 — liquid fill ------------------------------------------------- */
.pl-liquid .stack { position: relative; }
.pl-liquid .base { color: var(--ghost); }
.pl-liquid .fillw {
    position: absolute;
    inset: 0;
    color: var(--gold);
    clip-path: inset(100% 0 0 0);
    animation: liquid 2.7s cubic-bezier(0.5, 0, 0.2, 1) forwards;
}
@keyframes liquid { to { clip-path: inset(0 0 0 0); } }

/* 16 — dealing cards ----------------------------------------------- */
.pl-deal .deck { position: relative; width: 26cqw; height: 34cqw; }
.pl-deal .c {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: #f4f1e6;
    border: 2px solid var(--gold);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
    animation: deal 2.4s cubic-bezier(0.2, 1, 0.3, 1) forwards;
}
.pl-deal .c:nth-child(1) { --tx: -120%; --rot: -16deg; animation-delay: 0.05s; }
.pl-deal .c:nth-child(2) { --tx: 0%; --rot: 0deg; animation-delay: 0.2s; }
.pl-deal .c:nth-child(3) { --tx: 120%; --rot: 16deg; animation-delay: 0.35s; }
@keyframes deal {
    0% { transform: translateX(0) rotate(0) scale(0.8); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translateX(var(--tx)) rotate(var(--rot)) scale(1); opacity: 1; }
}

/* 17 — radar ------------------------------------------------------- */
.pl-radar .scope { position: relative; width: 38cqw; height: 38cqw; border-radius: 50%; border: 1px solid var(--line); }
.pl-radar .scope::before, .pl-radar .scope::after {
    content: '';
    position: absolute;
    border: 1px solid var(--line);
    border-radius: 50%;
}
.pl-radar .scope::before { inset: 22%; }
.pl-radar .scope::after { inset: 40%; }
.pl-radar .sweep {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(201, 168, 76, 0.55), transparent 62%);
    animation: spin 1.5s linear infinite;
    -webkit-mask: radial-gradient(circle, #000 62%, transparent 63%);
    mask: radial-gradient(circle, #000 62%, transparent 63%);
}
.pl-radar .ping {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    animation: ping 1.5s ease-out infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ping { 0% { opacity: 1; box-shadow: 0 0 0 0 rgba(201, 168, 76, 0.6); } 70%, 100% { opacity: 0.2; box-shadow: 0 0 0 14px rgba(201, 168, 76, 0); } }

/* 18 — slices ------------------------------------------------------ */
.pl-slices .stack { position: relative; }
.pl-slices .sl {
    position: absolute;
    inset: 0;
    animation: sliceIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.pl-slices .sl:nth-child(1) { clip-path: inset(0 0 75% 0); --from: -60%; }
.pl-slices .sl:nth-child(2) { clip-path: inset(25% 0 50% 0); --from: 60%; animation-delay: 0.1s; }
.pl-slices .sl:nth-child(3) { clip-path: inset(50% 0 25% 0); --from: -60%; animation-delay: 0.2s; }
.pl-slices .sl:nth-child(4) { clip-path: inset(75% 0 0 0); --from: 60%; animation-delay: 0.3s; }
@keyframes sliceIn { from { transform: translateX(var(--from)); opacity: 0; } to { transform: none; opacity: 1; } }

/* 19 — checklist --------------------------------------------------- */
.pl-check .list { width: 62cqw; display: flex; flex-direction: column; gap: 1.6cqh; font-size: clamp(9px, 3cqw, 20px); }
.pl-check .row { display: flex; align-items: center; gap: 10px; opacity: 0.25; animation: rowOn 0.4s ease forwards; }
.pl-check .row:nth-child(1) { animation-delay: 0.2s; }
.pl-check .row:nth-child(2) { animation-delay: 0.8s; }
.pl-check .row:nth-child(3) { animation-delay: 1.4s; }
.pl-check .row:nth-child(4) { animation-delay: 2s; }
.pl-check .tick { color: var(--gold); font-weight: 800; }
.pl-check .meter { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--gold); transform-origin: 0 50%; animation: fillX 2.6s cubic-bezier(0.4, 0, 0.1, 1) forwards; }
@keyframes rowOn { to { opacity: 1; } }

/* 20 — iris -------------------------------------------------------- */
.pl-iris .mask {
    position: absolute;
    inset: 0;
    background: var(--navy-900);
    -webkit-mask: radial-gradient(circle at 50% 50%, transparent var(--r, 0%), #000 calc(var(--r, 0%) + 0.6%));
    mask: radial-gradient(circle at 50% 50%, transparent var(--r, 0%), #000 calc(var(--r, 0%) + 0.6%));
    animation: iris 2.6s cubic-bezier(0.7, 0, 0.2, 1) forwards;
}
/* logo above the navy fill, fading as the iris opens past it */
.pl-iris img {
    position: relative;
    z-index: 2;
    width: 30cqw;
    animation: irisLogo 2.6s cubic-bezier(0.7, 0, 0.2, 1) forwards;
}
@keyframes irisLogo { 0%, 38% { opacity: 1; } 62%, 100% { opacity: 0; } }
@keyframes iris {
    0%, 35% { --r: 0%; }
    100% { --r: 86%; }
}
@property --r { syntax: '<percentage>'; initial-value: 0%; inherits: false; }

/* shared helper: the brand wordmark sizing inside tiles */
.word { font-weight: 900; font-size: clamp(18px, 9.5cqw, 92px); letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
.word--accent { font-family: var(--accent-font); font-weight: 400; letter-spacing: 0.01em; }
</style>
</head>
<body>

<header class="top">
    <h1>Preloader ideas</h1>
    <p>20 options, all running live. Click any tile to see it full screen. Nothing here is wired into the site yet — pick one and I'll build it in properly.</p>
    <button class="btn" id="replay">Replay all</button>
    <button class="btn" id="theme">Light</button>
</header>

<main class="grid" id="grid"></main>

<div class="stage" id="stage" hidden>
    <div class="stage__bar">
        <b id="stageName"></b>
        <small id="stageNote"></small>
        <button class="btn" id="stageReplay">Replay</button>
        <button class="btn" id="stageClose">Close</button>
    </div>
    <div class="stage__screen" id="stageScreen"></div>
</div>

<script>
const BRAND = 'SAMVESTOR';

// each loader: html to drop in, plus an optional init() for the ones that
// need a little scripting. init may return a cleanup function.
const LOADERS = [
    {
        name: 'Counter & bar',
        note: 'Odometer 000–100 with a filling gold bar',
        cls: 'pl-counter',
        html: `<div class="bar"><div class="fill"></div></div><div class="num">000</div>`,
        init(root) {
            const el = root.querySelector('.num');
            const t0 = performance.now();
            let raf;
            const tick = (t) => {
                const p = Math.min((t - t0) / 2600, 1);
                const eased = 1 - Math.pow(1 - p, 3);
                el.textContent = String(Math.round(eased * 100)).padStart(3, '0');
                if (p < 1) raf = requestAnimationFrame(tick);
            };
            raf = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(raf);
        },
    },
    {
        name: 'Gold wipe',
        note: 'The wordmark painted in left to right',
        cls: 'pl-wipe',
        html: `<div class="word">${BRAND}</div>`,
    },
    {
        name: 'Letters rise',
        note: 'Each letter lifts up behind a hard cut',
        cls: 'pl-rise',
        html: `<div class="word">${BRAND.split('').map((c, i) =>
            `<span class="m"><i style="animation-delay:${0.04 * i}s">${c}</i></span>`).join('')}</div>`,
    },
    {
        name: 'Bar folds to V',
        note: 'A loading bar bends into the SamVestor V',
        cls: 'pl-fold',
        html: `<div class="rig"><i></i><i></i></div>`,
    },
    {
        name: 'Ring & monogram',
        note: 'A gold arc draws around the SV mark',
        cls: 'pl-ring',
        html: `<svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="arc" cx="50" cy="50" r="42"/></svg><div class="mono">S<em>V</em></div>`,
    },
    {
        name: 'Curtain split',
        note: 'Two navy panels part to reveal the page',
        cls: 'pl-curtain',
        html: `<img src="/sv-logo-white.png" alt="" /><div class="half half--l"></div><div class="half half--r"></div>`,
    },
    {
        name: 'Terminal',
        note: 'Status lines typing out, dev-tool flavour',
        cls: 'pl-term',
        html: `<div class="box"><div class="row"><b>&gt;</b><span class="typed"></span><span class="caret"></span></div></div>`,
        init(root) {
            const el = root.querySelector('.typed');
            const lines = ['booting samvestor', 'loading revenue systems', 'ready'];
            let li = 0, ci = 0, timer;
            const step = () => {
                const line = lines[li];
                el.textContent = line.slice(0, ci);
                ci += 1;
                if (ci > line.length) {
                    li = Math.min(li + 1, lines.length - 1);
                    ci = 0;
                    timer = setTimeout(step, 420);
                } else {
                    timer = setTimeout(step, 55);
                }
            };
            step();
            return () => clearTimeout(timer);
        },
    },
    {
        name: 'Rolling digits',
        note: 'Percentage rolling on odometer strips',
        cls: 'pl-roll',
        html: `<div class="set">${[0, 1, 2].map(() =>
            `<div class="col"><div class="strip">${'0123456789'.split('').concat('0').map(d => `<span>${d}</span>`).join('')}</div></div>`).join('')}</div><div class="cap">loading</div>`,
        init(root) {
            const strips = [...root.querySelectorAll('.strip')];
            const t0 = performance.now();
            let raf;
            const tick = (t) => {
                const p = Math.min((t - t0) / 2600, 1);
                const v = (1 - Math.pow(1 - p, 3)) * 100;
                const o = v % 10;
                const te = (Math.floor(v / 10) % 10) + Math.max(0, o - 9);
                const h = Math.floor(v / 100) + Math.max(0, (v % 100) - 99);
                [h, te, o].forEach((val, i) => {
                    strips[i].style.transform = `translateY(${-val * (100 / 11)}%)`;
                });
                if (p < 1) raf = requestAnimationFrame(tick);
            };
            raf = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(raf);
        },
    },
    {
        name: 'Equaliser',
        note: 'Performance bars bouncing, then settling flat',
        cls: 'pl-eq',
        html: `<div class="bars">${[0, 1, 2, 3, 4, 5].map(i =>
            `<i style="animation-delay:${-0.18 * i}s, 0s"></i>`).join('')}</div>`,
    },
    {
        name: 'Revenue line',
        note: 'An upward chart line drawing to a glowing point',
        cls: 'pl-line',
        html: `<svg viewBox="0 0 200 90"><path d="M4 82 L44 66 L78 72 L112 40 L146 46 L196 8"/><circle class="dot" cx="196" cy="8"/></svg>`,
    },
    {
        name: 'Pixel grid',
        note: 'Cells filling in at random, like data landing',
        cls: 'pl-pixels',
        html: `<div class="mesh"></div>`,
        init(root) {
            const mesh = root.querySelector('.mesh');
            const N = 8;
            mesh.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
            const order = [...Array(N * N).keys()].sort(() => Math.random() - 0.5);
            mesh.innerHTML = Array.from({ length: N * N }, (_, i) =>
                `<b style="animation-delay:${(order.indexOf(i) / (N * N)) * 2.2}s"></b>`).join('');
        },
    },
    {
        name: 'Blur into focus',
        note: 'Wide and soft, snapping to crisp',
        cls: 'pl-blur',
        html: `<div class="word">${BRAND}</div>`,
    },
    {
        name: 'Scramble',
        note: 'Random glyphs resolving into the name',
        cls: 'pl-scramble',
        html: `<div class="word">${BRAND.split('').map(() => '<i class="off">A</i>').join('')}</div>`,
        init(root) {
            const cells = [...root.querySelectorAll('.word i')];
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&$@';
            const t0 = performance.now();
            let raf;
            const tick = (t) => {
                const p = Math.min((t - t0) / 2400, 1);
                const locked = Math.floor(p * cells.length * 1.15);
                cells.forEach((c, i) => {
                    if (i < locked) {
                        c.textContent = BRAND[i];
                        c.className = 'on';
                    } else {
                        c.textContent = chars[(Math.random() * chars.length) | 0];
                        c.className = 'off';
                    }
                });
                if (p < 1) raf = requestAnimationFrame(tick);
            };
            raf = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(raf);
        },
    },
    {
        name: 'Coin flip',
        note: 'A rupee coin spinning down into place',
        cls: 'pl-coin',
        html: `<div class="coin">₹</div>`,
    },
    {
        name: 'Liquid fill',
        note: 'The name filling with gold from the bottom',
        cls: 'pl-liquid',
        html: `<div class="stack"><div class="word base">${BRAND}</div><div class="word fillw">${BRAND}</div></div>`,
    },
    {
        name: 'Dealing cards',
        note: 'Three cards fanning out — the site card language',
        cls: 'pl-deal',
        html: `<div class="deck"><div class="c"></div><div class="c"></div><div class="c"></div></div>`,
    },
    {
        name: 'Radar sweep',
        note: 'A scope sweeping, nodding at the About globe',
        cls: 'pl-radar',
        html: `<div class="scope"><div class="sweep"></div><span class="ping" style="left:62%;top:34%"></span><span class="ping" style="left:33%;top:60%;animation-delay:.7s"></span></div>`,
    },
    {
        name: 'Sliced reveal',
        note: 'The wordmark in bands sliding from both sides',
        cls: 'pl-slices',
        html: `<div class="stack"><div class="word" style="opacity:0">${BRAND}</div>${[0, 1, 2, 3].map(() =>
            `<div class="sl"><div class="word">${BRAND}</div></div>`).join('')}</div>`,
    },
    {
        name: 'Checklist',
        note: 'Plain-spoken progress: what is actually loading',
        cls: 'pl-check',
        html: `<div class="list">
            <div class="row"><span class="tick">✓</span><span>Brand assets</span></div>
            <div class="row"><span class="tick">✓</span><span>Fonts</span></div>
            <div class="row"><span class="tick">✓</span><span>Case studies</span></div>
            <div class="row"><span class="tick">✓</span><span>Ready</span></div>
        </div><div class="meter"></div>`,
    },
    {
        name: 'Iris open',
        note: 'The logo, then the screen opens out from it',
        cls: 'pl-iris',
        html: `<img src="/sv-logo-white.png" alt="" /><div class="mask"></div>`,
    },
];

const CYCLE = 4200; // how often each tile replays itself

/** drop a loader into a container and start it; returns a stop() */
function mount(box, loader) {
    box.innerHTML = `<div class="pl ${loader.cls}">${loader.html}</div>`;
    const cleanup = loader.init ? loader.init(box.querySelector('.pl')) : null;
    return () => { if (typeof cleanup === 'function') cleanup(); };
}

/** keep one tile looping forever */
function loop(box, loader, delay = 0) {
    let stop = () => {};
    let timer = null;
    // clearing inside run() matters: a manual replay used to leave the
    // scheduled tick behind, and that orphan kept remounting after kill()
    const run = () => {
        clearTimeout(timer);
        stop();
        stop = mount(box, loader);
        timer = setTimeout(run, CYCLE);
    };
    timer = setTimeout(run, delay);
    return {
        replay: run,
        kill() {
            clearTimeout(timer);
            timer = null;
            stop();
        },
    };
}

// ---- build the grid ----
const grid = document.getElementById('grid');
const tiles = LOADERS.map((loader, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
        <div class="screen" title="Click for full screen"></div>
        <div class="meta">
            <b>${String(i + 1).padStart(2, '0')}</b>
            <span>${loader.name}</span>
            <small>${loader.note}</small>
        </div>`;
    grid.appendChild(card);
    const screen = card.querySelector('.screen');
    screen.addEventListener('click', () => openStage(i));
    return loop(screen, loader, i * 130);
});

document.getElementById('replay').addEventListener('click', () => tiles.forEach(t => t.replay()));

// ---- full screen preview ----
const stage = document.getElementById('stage');
const stageScreen = document.getElementById('stageScreen');
let stageLoop = null;

function openStage(i) {
    const loader = LOADERS[i];
    document.getElementById('stageName').textContent = `${String(i + 1).padStart(2, '0')} · ${loader.name}`;
    document.getElementById('stageNote').textContent = loader.note;
    stage.hidden = false;
    stageLoop = loop(stageScreen, loader, 0);
    stageLoop.replay();
}

function closeStage() {
    if (stageLoop) stageLoop.kill();
    stageLoop = null;
    stageScreen.innerHTML = '';
    stage.hidden = true;
}

document.getElementById('stageClose').addEventListener('click', closeStage);
document.getElementById('stageReplay').addEventListener('click', () => stageLoop && stageLoop.replay());
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeStage(); });

// ---- light / dark ----
const themeBtn = document.getElementById('theme');
themeBtn.addEventListener('click', () => {
    const light = document.documentElement.dataset.theme === 'light';
    document.documentElement.dataset.theme = light ? 'dark' : 'light';
    themeBtn.textContent = light ? 'Light' : 'Dark';
});
</script>
